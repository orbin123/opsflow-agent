global:
  scrape_interval: 60s
  scrape_timeout: 15s
scrape_configs:
  - job_name: opsflow
    scheme: https
    metrics_path: /metrics
    basic_auth:
      username: opsflow-metrics
      password_file: /run/secrets/opsflow_metrics_password
    static_configs:
      - targets: [opsflow-temporary-demo.onrender.com:443]
        labels:
          environment: render
